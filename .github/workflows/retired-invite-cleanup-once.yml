name: One-time retired TEST notebook invitation safe revoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retired-invite-cleanup-once.yml'
permissions:
  contents: read
jobs:
  single-safe-revoke:
    if: github.repository == 'honbin002-design/honbin-crm-auth-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exactly one status-only write under strict root owner guard
        run: node retired-notebook-single-cleanup-preflight.mjs
      - name: Install existing TEST firebase-admin without install scripts
        run: npm install --no-save --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Revoke only one proven PENDING VIEWER invitation from retired owner notebook
        env:
          RETIRED_INVITE_SINGLE_CLEANUP_APPROVED: 'yes'
          TEST_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.TEST_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node retired-notebook-single-stale-invite-cleanup.mjs
# No new Firebase services, no recurring job; only status REVOKED on exact old invite.
