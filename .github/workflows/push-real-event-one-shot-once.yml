name: One-time verified REAL task/note event push to one existing iPhone
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-real-event-one-shot-once.yml'
permissions:
  contents: read
jobs:
  exactly-one-live-event:
    if: github.repository == 'honbin002-design/honbin-crm-auth-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REAL_EVENT_ONE_SHOT_APPROVED: 'yes'
      TEST_PUSH_SEND_ENABLED: ${{ vars.TEST_PUSH_SEND_ENABLED }}
      TEST_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.TEST_FIREBASE_SERVICE_ACCOUNT_JSON }}
      TEST_VAPID_PUBLIC_KEY: ${{ secrets.TEST_VAPID_PUBLIC_KEY }}
      TEST_VAPID_PRIVATE_KEY: ${{ secrets.TEST_VAPID_PRIVATE_KEY }}
      TEST_PUSH_CONTACT: ${{ secrets.TEST_PUSH_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check strict live event gate
        run: node --check push-real-event-verified-one-shot.mjs
      - name: Install pinned, free package dependencies without hooks
        run: npm install --no-save --no-audit --no-fund --ignore-scripts firebase-admin@14.5.0 web-push@3.6.7
      - name: Revalidate active approved recipient then send at most one content-free event link
        run: node push-real-event-verified-one-shot.mjs
# Temporary one-time workflow. NO schedule, no Firestore writes, no mass notifications.
