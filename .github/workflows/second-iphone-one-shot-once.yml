name: One-time SECOND verified member iPhone Web Push (no schedule)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/second-iphone-one-shot-once.yml'
permissions:
  contents: read
jobs:
  single-safe-second-member-delivery:
    if: github.repository == 'honbin002-design/honbin-crm-auth-test'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SECOND_IPHONE_ALREADY_SUBSCRIBED: 'yes'
      TEST_PUSH_SEND_ENABLED: ${{ vars.TEST_PUSH_SEND_ENABLED }}
      TEST_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.TEST_FIREBASE_SERVICE_ACCOUNT_JSON }}
      TEST_VAPID_PUBLIC_KEY: ${{ secrets.TEST_VAPID_PUBLIC_KEY }}
      TEST_VAPID_PRIVATE_KEY: ${{ secrets.TEST_VAPID_PRIVATE_KEY }}
      TEST_PUSH_CONTACT: ${{ secrets.TEST_PUSH_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check exact-second-member bounded one-shot
        run: node --check push-second-iphone-one-shot.mjs
      - name: Install free pinned Firebase and Apple push dependencies
        run: npm install --no-save --no-audit --no-fund --ignore-scripts firebase-admin@14.5.0 web-push@3.6.7
      - name: Verify member, one device, then one generic push maximum
        run: node push-second-iphone-one-shot.mjs
# Runs only once on creation; delete this temporary workflow immediately afterwards.
# No recurring sender, no Firestore writes, no private message content.
