name: Auth-only static safety checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone page does not touch Firestore or CRM
        run: node auth-only-preflight.mjs
      - name: Verify notes preview is complete and Firestore stays HOLD
        run: node notes-preview-preflight.mjs
      - name: Verify global owner Google approval UI
        run: node approved-accounts-preflight.mjs
      - name: Verify archive V3 rule copy helper honors current owner whitelist
        run: node firestore-notebook-archive-preflight.mjs
      - name: Verify V4D delete preview stays disabled independent of notes sync
        run: node notebook-hard-delete-v4d-preflight.mjs
      - name: Verify V4D owner rule copy helper is review-only
        run: node firestore-notebook-hard-delete-v4d-preflight.mjs
      - name: Verify V4D create-only synthetic notebook page
        run: node notebook-v4d-fixture-preflight.mjs
      - name: Verify dedicated V4D notebook readback remains read-only
        run: node notebook-v4d-target-readback-preflight.mjs
      - name: Verify exact-scope V4D synthetic phase-one cleanup and locked root
        run: node notebook-v4d-target-cleanup-phase1-preflight.mjs
      - name: Verify V4D independent locked-root post-cleanup readback
        run: node notebook-v4d-target-postcleanup-readback-preflight.mjs
