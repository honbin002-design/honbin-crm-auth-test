name: Auth-only static safety checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone page does not touch Firestore or CRM
        run: node auth-only-preflight.mjs
      - name: Verify notes preview is complete and Firestore stays HOLD
        run: node notes-preview-preflight.mjs
      - name: Verify global owner Google approval UI
        run: node approved-accounts-preflight.mjs
      - name: Verify archive V3 rule copy helper honors current owner whitelist
        run: node firestore-notebook-archive-preflight.mjs
      - name: Verify V4D delete preview stays disabled independent of notes sync
        run: node notebook-hard-delete-v4d-preflight.mjs
      - name: Verify V4D owner rule copy helper is review-only
        run: node firestore-notebook-hard-delete-v4d-preflight.mjs
      - name: Verify V4D create-only synthetic notebook page
        run: node notebook-v4d-fixture-preflight.mjs
      - name: Verify dedicated V4D notebook readback remains read-only
        run: node notebook-v4d-target-readback-preflight.mjs
      - name: Verify exact-scope V4D synthetic phase-one cleanup and locked root
        run: node notebook-v4d-target-cleanup-phase1-preflight.mjs
      - name: Verify V4D independent locked-root post-cleanup readback
        run: node notebook-v4d-target-postcleanup-readback-preflight.mjs
      - name: Verify V4D final post-deletion index readback is read-only
        run: node notebook-v4d-final-index-readback-preflight.mjs
      - name: Verify owner-only notebook pre-delete inventory stays read-only
        run: node notebook-owner-readonly-inventory-preflight.mjs
      - name: Verify cross-account notebook access checker is read-only
        run: node notebook-cross-account-readonly-preflight.mjs
      - name: Verify exact test notebook invitation duplicate safety gate
        run: node notebook-invite-exact-test-preflight.mjs
      - name: Verify scoped V4D invitation test safety
        run: node notebook-v4d-invite-accept-preflight.mjs
      - name: Verify scoped VIEWER denial test requires explicit tap and checks no writes
        run: node notebook-viewer-write-denial-preflight.mjs
      - name: Verify private-notes isolation and VIEWER absent-path denial remain scoped
        run: node notebook-private-viewer-denial-preflight.mjs
      - name: Verify owner-scoped member role change has exact recipient and single write
        run: node notebook-member-role-owner-preflight.mjs
      - name: Verify local draft write coalescing, barriers, and UID isolation
        run: node firebase-offline-drafts-coalescing-preflight.mjs
      - name: Verify simplified TEST workspace and task security gates
        run: node workspace-v2-preflight.mjs
      - name: Verify task assignment, single completion, and nickname client behavior
        run: node task-nickname-client-preflight.mjs
      - name: Verify zero-cost iPhone Web Push PWA groundwork
        run: node push-pwa-readiness-preflight.mjs
      - name: Verify scoped notification recipients and privacy
        run: node notification-recipient-router-preflight.mjs
      - name: Verify private opt-in iPhone Push subscription client
        run: node push-subscription-client-preflight.mjs
      - name: Verify zero-cost sender safe-hold and private subscription ACL
        run: node --check notification-free-sender-REVIEW-ONLY.mjs && node notification-sender-review-preflight.mjs && node notification-free-sender-REVIEW-ONLY.mjs
      - name: Verify safe incremental push-only or three-rule candidate
        run: node firestore-push-safe-candidate-preflight.mjs
      - name: Verify pasted Firebase candidate exact-match before publishing
        run: node firebase-rules-final-verify-preflight.mjs
      - name: Verify current notification event before delivery
        run: node notification-event-freshness-preflight.mjs
      - name: Verify live server read denial probes never write and fail closed
        run: node firestore-live-denial-probes-preflight.mjs
      - name: Verify offline-only exact two-match Firestore rules merge
        run: node firestore-task-nickname-merge-preflight.mjs
      - name: Verify owner-only settings member management and scoped Firestore transaction
        run: node owner-member-management-preflight.mjs
