name: Private zero-cost iPhone push secret readiness (no delivery)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-secret-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-private-key-pair:
    if: github.repository == 'honbin002-design/honbin-crm-auth-test'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check only whether secrets are installed and matched, never print values
        env:
          TEST_VAPID_PUBLIC_KEY: ${{ secrets.TEST_VAPID_PUBLIC_KEY }}
          TEST_VAPID_PRIVATE_KEY: ${{ secrets.TEST_VAPID_PRIVATE_KEY }}
          TEST_PUSH_CONTACT: ${{ secrets.TEST_PUSH_CONTACT }}
          TEST_PUSH_SEND_ENABLED: ${{ vars.TEST_PUSH_SEND_ENABLED }}
        run: node push-secret-readiness-probe.mjs
# No Firestore writes, no Firebase Admin credential, no push send, no billing.
