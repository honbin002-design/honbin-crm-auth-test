name: Orders candidate Firestore emulator
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node prepare-firestore-orders-v1-emulator-rules.mjs
      - run: nl -ba .test-rules/firestore.emulator.rules | sed -n '340,380p'
      - run: npx firebase emulators:exec --config firebase.emulator.test.json --project demo-honbin-orders-v1 --only firestore 'node firestore-orders-v1-emulator-test.mjs'
      - run: npx firebase emulators:exec --config firebase.emulator.test.json --project demo-honbin-change-stream --only firestore 'node notification-collection-scope-emulator-test.mjs'
