name: One-time owner iPhone direct Web Push acceptance (free, no schedule)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iphone-owner-push-one-shot.yml'
permissions:
  contents: read
jobs:
  one-direct-synthetic-push:
    if: github.repository == 'honbin002-design/honbin-crm-auth-test'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OWNER_SUBSCRIBED_SCREENSHOT_CONFIRMED: 'yes'
      TEST_PUSH_SEND_ENABLED: ${{ vars.TEST_PUSH_SEND_ENABLED }}
      TEST_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.TEST_FIREBASE_SERVICE_ACCOUNT_JSON }}
      TEST_VAPID_PUBLIC_KEY: ${{ secrets.TEST_VAPID_PUBLIC_KEY }}
      TEST_VAPID_PRIVATE_KEY: ${{ secrets.TEST_VAPID_PRIVATE_KEY }}
      TEST_PUSH_CONTACT: ${{ secrets.TEST_PUSH_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail early if one-time sender syntax invalid
        run: node --check push-owner-iphone-one-shot.mjs
      - name: Install pinned zero-cost Apple Web Push sender packages
        run: npm install --no-save --no-audit --no-fund --ignore-scripts firebase-admin@14.5.0 web-push@3.6.7
      - name: Send max one content-free Web Push to verified owner enrolled iPhone
        run: node push-owner-iphone-one-shot.mjs
# Single self-triggering workflow, to be deleted immediately after one run.
# No recurring delivery, no Firestore writes, no external paid services.
